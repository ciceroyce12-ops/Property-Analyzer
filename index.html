<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Land Prospect Analyzer 2030</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; background: #000; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    
    .panel {
      position: absolute; top: 15px; left: 15px; z-index: 1000;
      background: rgba(15, 23, 42, 0.95); color: #f8fafc;
      padding: 16px; border-radius: 14px; width: 350px; max-width: 92vw;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15); max-height: 95vh; overflow-y: auto;
    }
    .panel h2 { font-size: 1.05rem; margin-bottom: 2px; color: #38bdf8; }
    .panel p { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; line-height: 1.3; }
    
    .search-box { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-box input { 
      flex: 1; padding: 7px 10px; border-radius: 6px; 
      border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); 
      color: white; outline: none; font-size: 0.78rem; 
    }
    .search-box button { 
      padding: 7px 10px; border-radius: 6px; border: none; 
      background: #38bdf8; color: #0f172a; cursor: pointer; font-weight: bold; font-size: 0.78rem;
    }
    .search-box button:hover { background: #0ea5e9; }

    .hotspots-section { margin-bottom: 10px; background: rgba(56, 189, 248, 0.08); padding: 8px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .hotspots-section h4 { font-size: 0.72rem; color: #38bdf8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .hotspot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .hotspot-btn { 
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); 
      color: #cbd5e1; padding: 5px; border-radius: 5px; font-size: 0.68rem; 
      cursor: pointer; text-align: left; transition: all 0.2s; 
    }
    .hotspot-btn:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }

    .slider-group { margin-bottom: 8px; }
    .slider-group label { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 600; margin-bottom: 2px; color: #cbd5e1; }
    .slider-group input { width: 100%; accent-color: #38bdf8; cursor: pointer; height: 5px; }
    
    .stats-card {
      margin-top: 10px; background: rgba(255,255,255,0.05);
      padding: 10px; border-radius: 8px; border-left: 4px solid #38bdf8;
    }
    .stats-card h3 { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .score-display { font-size: 1.8rem; font-weight: 800; color: #4ade80; margin: 2px 0; }
    .location-details { font-size: 0.72rem; color: #cbd5e1; margin-bottom: 4px; }
    
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .metric-badge { background: rgba(0,0,0,0.4); padding: 5px; border-radius: 5px; font-size: 0.68rem; color: #facc15; font-weight: bold; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
    
    .legend { margin-top: 8px; font-size: 0.65rem; color: #94a3b8; display: flex; gap: 8px; justify-content: center; }
    .legend span { display: flex; align-items: center; gap: 3px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .dot.transit { background: #60a5fa; }
    .dot.com { background: #facc15; }
    .dot.amenity { background: #4ade80; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>4-Year Land Prospect AI</h2>
    <p>Global Satellite GIS with Dynamic Color-Coded Risk Zones.</p>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search city (e.g. Surakarta)..." onkeydown="if(event.key === 'Enter') searchLocation()">
      <button onclick="searchLocation()">Search</button>
    </div>

    <div class="hotspots-section">
      <h4>🔥 Top 4 Undervalued Growth Hotspots</h4>
      <div class="hotspot-grid">
        <button class="hotspot-btn" onclick="jumpToHotspot(-6.1856, 106.9483, 14)">1. Cakung (Jakarta)</button>
        <button class="hotspot-btn" onclick="jumpToHotspot(-6.3227, 107.1472, 14)">2. Cikarang (Bekasi)</button>
        <button class="hotspot-btn" onclick="jumpToHotspot(-6.3034, 106.6542, 14)">3. BSD (Tangerang)</button>
        <button class="hotspot-btn" onclick="jumpToHotspot(-7.5561, 110.8522, 14)">4. Jebres (Surakarta)</button>
      </div>
    </div>
    
    <div class="slider-group">
      <label>Transit Impact <span id="val-transit">70</span></label>
      <input type="range" id="weight-transit" min="0" max="100" value="70">
    </div>
    <div class="slider-group">
      <label>Commercial Zoning <span id="val-zoning">80</span></label>
      <input type="range" id="weight-zoning" min="0" max="100" value="80">
    </div>
    <div class="slider-group">
      <label>Amenity Density <span id="val-amenity">65</span></label>
      <input type="range" id="weight-amenity" min="0" max="100" value="65">
    </div>

    <div class="stats-card">
      <h3>Appreciation Potential</h3>
      <div class="score-display" id="prospect-score">-- %</div>
      <div class="location-details" id="location-info">Tap map or select hotspot...</div>
      
      <div class="metrics-grid">
        <div class="metric-badge" id="metric-transit">🚉 Transit: --</div>
        <div class="metric-badge" id="metric-com">🏢 Comm: --</div>
        <div class="metric-badge" id="metric-amenity">🌳 Amenities: --</div>
        <div class="metric-badge" id="metric-elev">⛰️ Flood Risk: --</div>
      </div>

      <div class="legend">
        <span><div class="dot transit"></div> Transit</span>
        <span><div class="dot com"></div> Comm</span>
        <span><div class="dot amenity"></div> Amenities</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-6.2088, 106.8456], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 18
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19,
      pane: 'shadowPane'
    }).addTo(map);

    let activeLayers = L.layerGroup().addTo(map);
    let clickTimeout = null;

    async function searchLocation() {
      const query = document.getElementById('search-input').value;
      if (!query) return;
      document.getElementById('search-input').value = "Searching...";
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          map.flyTo([parseFloat(data[0].lat), parseFloat(data[0].lon)], 14);
          document.getElementById('search-input').value = query;
        } else {
          alert("Location not found.");
          document.getElementById('search-input').value = query;
        }
      } catch (error) {
        alert("Search failed.");
        document.getElementById('search-input').value = query;
      }
    }

    function jumpToHotspot(lat, lng, zoom) {
      map.flyTo([lat, lng], zoom);
      setTimeout(() => evaluateCoordinates(lat, lng), 1200);
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function calculateRealProspect(lat, lng) {
      const cacheKey = `${lat},${lng}`;
      if (sessionStorage.getItem(cacheKey)) return JSON.parse(sessionStorage.getItem(cacheKey));

      try {
        const elRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lng}`);
        const elData = await elRes.json();
        const elevation = elData.elevation[0] || 0;

        const query = `
          [out:json][timeout:15];
          (
            node["public_transport"](around:1200, ${lat}, ${lng});
            node["shop"](around:1200, ${lat}, ${lng});
            node["office"](around:1200, ${lat}, ${lng});
            node["amenity"](around:1200, ${lat}, ${lng});
            node["leisure"="park"](around:1200, ${lat}, ${lng});
          );
          out body;
        `;
        const poiRes = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const poiData = await poiRes.json();

        let rawTransit = 0, rawCom = 0, rawAmenity = 0;
        let tNodes = 0, cNodes = 0, aNodes = 0;
        const nodesToMap = [];

        poiData.elements.forEach(el => {
          const distance = Math.max(getDistance(lat, lng, el.lat, el.lon), 0.05);
          const decayValue = 1 / Math.pow(distance, 2);
          
          let type = '';
          if (el.tags.public_transport) {
            rawTransit += decayValue; tNodes++; type = 'transit';
          } else if (el.tags.shop || el.tags.office) {
            rawCom += decayValue; cNodes++; type = 'com';
          } else if (el.tags.amenity || el.tags.leisure) {
            rawAmenity += decayValue; aNodes++; type = 'amenity';
          }
          
          if (type) nodesToMap.push({ lat: el.lat, lon: el.lon, type });
        });

        const transitScore = Math.min((rawTransit / 35) * 100, 100); 
        const zoningScore = Math.min((rawCom / 120) * 100, 100);
        const amenityScore = Math.min((rawAmenity / 80) * 100, 100);

        const dataObj = { elevation, transitScore, zoningScore, amenityScore, tNodes, cNodes, aNodes, nodesToMap };
        sessionStorage.setItem(cacheKey, JSON.stringify(dataObj));
        return dataObj;

      } catch (error) {
        console.error(error);
        return null;
      }
    }

    async function evaluateCoordinates(lat, lng) {
      document.getElementById('prospect-score').innerText = '...';
      document.getElementById('prospect-score').style.color = '#94a3b8';
      document.getElementById('location-info').innerText = `Coords: ${lat}, ${lng}`;
      document.getElementById('metric-transit').innerText = `🚉 Transit: Calc...`;
      document.getElementById('metric-com').innerText = `🏢 Comm: Calc...`;
      document.getElementById('metric-amenity').innerText = `🌳 Amenities: Calc...`;

      activeLayers.clearLayers();

      const latLngObj = L.latLng(lat, lng);
      
      const data = await calculateRealProspect(lat, lng);
      if(!data) return alert("API Rate limit hit. Please wait a few seconds.");

      const wT = parseInt(document.getElementById('weight-transit').value);
      const wZ = parseInt(document.getElementById('weight-zoning').value);
      const wA = parseInt(document.getElementById('weight-amenity').value);
      
      const totalWeight = wT + wZ + wA;
      let baseScore = ((data.transitScore * wT) + (data.zoningScore * wZ) + (data.amenityScore * wA)) / totalWeight;

      const floodPenalty = data.elevation < 5 ? 25 : (data.elevation < 10 ? 10 : 0);
      const finalScore = Math.max(0, Math.min(Math.round(baseScore - floodPenalty), 98));

      // Dynamic Global Color Coding (Green for Good, Yellow for Neutral, Red for Bad/Risky)
      const badgeColor = finalScore > 75 ? '#4ade80' : finalScore > 50 ? '#facc15' : '#f87171';

      // Draw Center Pin & Dynamic Color-Coded Catchment Zone Block
      L.circleMarker(latLngObj, { radius: 8, fillColor: badgeColor, color: '#000', weight: 2, fillOpacity: 1 }).addTo(activeLayers);
      L.circle(latLngObj, { radius: 1200, color: badgeColor, weight: 2, fillColor: badgeColor, fillOpacity: 0.18, dashArray: '6, 6' }).addTo(activeLayers);

      document.getElementById('prospect-score').innerText = finalScore + '%';
      document.getElementById('prospect-score').style.color = badgeColor;
      document.getElementById('metric-transit').innerText = `🚉 Transit: ${data.tNodes}`;
      document.getElementById('metric-com').innerText = `🏢 Comm: ${data.cNodes}`;
      document.getElementById('metric-amenity').innerText = `🌳 Amenities: ${data.aNodes}`;
      document.getElementById('metric-elev').innerText = `⛰️ Elev: ${data.elevation}m (${floodPenalty > 0 ? 'Flood Risk' : 'Safe'})`;

      data.nodesToMap.forEach(n => {
        let nodeColor = '#60a5fa';
        if(n.type === 'com') nodeColor = '#facc15';
        if(n.type === 'amenity') nodeColor = '#4ade80';

        L.circleMarker([n.lat, n.lon], {
          radius: 3.5, fillColor: nodeColor, color: '#000', weight: 1, fillOpacity: 0.9
        }).addTo(activeLayers);
      });
    }

    map.on('click', function(e) {
      clearTimeout(clickTimeout);
      clickTimeout = setTimeout(() => {
        const lat = e.latlng.lat.toFixed(4);
        const lng = e.latlng.lng.toFixed(4);
        evaluateCoordinates(lat, lng);
      }, 400);
    });

    ['transit', 'zoning', 'amenity'].forEach(id => {
      const slider = document.getElementById(`weight-${id}`);
      slider.addEventListener('input', () => document.getElementById(`val-${id}`).innerText = slider.value);
    });
  </script>
</body>
</html>
